[project]
name = "princetonpy"
version = "0.1.0"
description = "A website for the Princeton Python users group."
authors = ["mhadam <michael@hadam.us>"]
license = "MIT License"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1.1",
    "django-mailinglist>=0.1.7",
    "huey>=2.5.1",
    "hypercorn>=0.17.3",
    "sorl-thumbnail>=12.10.0",
    "whitenoise[brotli]>=6.7.0",
    "django-ses[events]>=4.1.1",
    "django-tinymce>=4.1.0",
    "django-environ>=0.11.2",
]

[tool.uv]
dev-dependencies = [
    "faker>=28.4.1",
    "pytest-django>=4.9.0",
]
